# Published content, paginated. Feeds both the sitemap (indexable items only)
# and the catch-all route's prerender entries (everything, including hidden
# pages that nothing links to).
query Sitemap($after: String) {
	contentNodes(first: 100, after: $after, where: { contentTypes: [PAGE, POST, PROJECT], status: PUBLISH }) {
		pageInfo {
			hasNextPage
			endCursor
		}
		nodes {
			uri
			modifiedGmt
			noindex
		}
	}
}
