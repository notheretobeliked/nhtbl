query PreviewContent($id: ID!) {
  # Try as page first with preview support
  page(id: $id, idType: DATABASE_ID) {
    __typename
    id
    databaseId
    title
    status
    modified
    backgroundColour {
      backgroundColour
    }
    editorBlocks {
      name
      parentClientId
      clientId
      ...CoreParagraphFragment
      ...CoreHeadingFragment
      ...AcfHomePageHeroFragment
      ...AcfServicePushFragment
      ...CoreColumnsFragment
      ...AcfGalerieFragment
      ...AcfPortfolioBlockFragment
      ...CoreGroupFragment
      ...CoreButtonFragment
      ...CoreButtonsFragment
      ...CoreSpacerFragment
      ...CoreListFragment
      ...CoreListItemFragment
      ...PortfolioBlockDetailsFragment
      ...AcfLinkBlockFragment
      ...CoreImageFragment
      ...CoreVideoFragment
      ...CoreColumnFragment
      ...AcfSlideshowFragment
      ...AcfSlideFragment
      ...AcfSubpageNavigationFragment
    }
  }

  # Also try as custom post type with preview support
  nhtblProject(id: $id, idType: DATABASE_ID) {
    __typename
    id
    databaseId
    title
    status
    modified
    excerpt
    nhtblClients {
      nodes {
        name
        id
        parentId
        slug
      }
    }
    nhtblServices {
      nodes {
        id
        name
        slug
        parentId
      }
    }
    projectData {
      startDate
      endDate
      imageGallery {
        nodes {
          altText
          colorPalette
          dominantColor
          secondaryColor
          mediaDetails {
            ...MediaDetailsFragment
          }
        }
      }
    }
    editorBlocks {
      name
      parentClientId
      clientId
      ...CoreParagraphFragment
      ...CoreHeadingFragment
      ...AcfHomePageHeroFragment
      ...AcfServicePushFragment
      ...CoreColumnsFragment
      ...AcfGalerieFragment
      ...AcfPortfolioBlockFragment
      ...CoreGroupFragment
      ...CoreButtonFragment
      ...CoreButtonsFragment
      ...CoreSpacerFragment
      ...CoreListFragment
      ...CoreListItemFragment
      ...PortfolioBlockDetailsFragment
      ...AcfLinkBlockFragment
      ...CoreImageFragment
      ...CoreVideoFragment
      ...CoreColumnFragment
      ...AcfSlideshowFragment
      ...AcfSlideFragment
      ...AcfSubpageNavigationFragment
    }
  }

  # Fallback: try as regular post with preview support
  post(id: $id, idType: DATABASE_ID) {
    __typename
    id
    databaseId
    title
    status
    modified
    excerpt
    editorBlocks {
      name
      parentClientId
      clientId
      ...CoreParagraphFragment
      ...CoreHeadingFragment
      ...AcfHomePageHeroFragment
      ...AcfServicePushFragment
      ...CoreColumnsFragment
      ...AcfGalerieFragment
      ...AcfPortfolioBlockFragment
      ...CoreGroupFragment
      ...CoreButtonFragment
      ...CoreButtonsFragment
      ...CoreSpacerFragment
      ...CoreListFragment
      ...CoreListItemFragment
      ...PortfolioBlockDetailsFragment
      ...AcfLinkBlockFragment
      ...CoreImageFragment
      ...CoreVideoFragment
      ...CoreColumnFragment
      ...AcfSlideshowFragment
      ...AcfSlideFragment
      ...AcfSubpageNavigationFragment
    }
  }
}# Shared GraphQL fragments used across multiple queries

fragment MediaDetailsFragment on MediaDetails {
  sizes {
    name
    sourceUrl
    width
    height
  }
}

fragment CoreVideoFragment on CoreVideo {
  attributes {
    autoplay
    align
    caption
    controls
    loop
    muted
    playsInline
    preload
    src
    style
  }
}

fragment CoreGroupFragment on CoreGroup {
  attributes {
    backgroundColor
    align
    style
    layout
    behavior
    minHeight
    contentAlign
    reveal
    revealDirection
    revealStagger
    parallax
  }
}

fragment CoreImageFragment on CoreImage {
  attributes {
    alt
    align
    aspectRatio
    borderColor
    caption
    cssClassName
    sizeSlug
    style
    src
  }
  altText
  colorPalette
  dominantColor
  secondaryColor
  mediaDetails {
    ...MediaDetailsFragment
  }
}

fragment CoreButtonFragment on CoreButton {
  attributes {
    className
    gradient
    metadata
    rel
    type
    backgroundColor
    borderColor
    textColor
    style
    fontSize
    linkTarget
    text
    url
  }
  innerBlocks {
    apiVersion
    blockEditorCategoryName
    clientId
    name
    parentClientId
    renderedHtml
  }
}

fragment CoreColumnsFragment on CoreColumns {
  attributes {
    layout
    className
    verticalAlignment
    style
    align
    isStackedOnMobile
  }
}

fragment CoreColumnFragment on CoreColumn {
  attributes {
    layout
    className
    verticalAlignment
    style
  }
}

fragment CoreParagraphFragment on CoreParagraph {
  attributes {
    content
    fontFamily
    fontSize
    textColor
    align
    cssClassName
  }
}

fragment CoreHeadingFragment on CoreHeading {
  attributes {
    content
    fontFamily
    fontSize
    textColor
    level
    align
    cssClassName
  }
}

fragment CoreSpacerFragment on CoreSpacer {
  attributes {
    height
    style
  }
}

fragment CoreButtonsFragment on CoreButtons {
  attributes {
    align
    layout
  }
}

fragment AcfHomePageHeroFragment on AcfHomePageHero {
  attributes {
    backgroundColor
    align
  }
  homePageHero {
    images(first: 100) {
      nodes {
        altText
        colorPalette
        dominantColor
        secondaryColor
        mediaDetails {
          ...MediaDetailsFragment
        }
        mediaType
        mimeType
        mediaItemUrl
      }
    }
  }
}

fragment AcfServicePushFragment on AcfServicePush {
  attributes {
    align
    backgroundColor
  }
  servicePush {
    service {
      nodes {
        slug
        ... on Page {
          id
          title
          uri
          featuredImage {
            node {
              altText
              colorPalette
              dominantColor
              secondaryColor
              mediaDetails {
                ...MediaDetailsFragment
              }
            }
          }
        }
      }
    }
  }
}

fragment AcfGalerieFragment on AcfGalerie {
  attributes {
    align
  }
  galerie {
    galerie {
      nodes {
        mediaType
        mimeType
        mediaItemUrl
        caption(format: RENDERED)
        altText
        colorPalette
        dominantColor
        secondaryColor
        mediaDetails {
          ...MediaDetailsFragment
        }
      }
    }
  }
}

fragment AcfPortfolioBlockFragment on AcfPortfolioBlock {
  attributes {
    alignment: align
    backgroundColor
    textColor
    style
  }
  portfolioBlock {
    displayMode
    enableSearch
    showTags
    projectSource
    projectsPerPage
    selectedService {
      nodes {
        slug
        name
      }
    }
    sortOrder
    specificProjects {
      nodes {
        slug
        ... on Nhtbl_project {
          id
          uri
          nhtblClients {
            nodes {
              name
              slug
            }
          }
          nhtblServices {
            nodes {
              name
              slug
              parentId
              id
            }
          }
          projectData {
            startDate
            endDate
          }
        }
      }
    }
  }
}

fragment PortfolioBlockDetailsFragment on AcfPortfolioBlock {
  name
  attributes {
    align
  }
  portfolioBlock {
    specificProjects {
      nodes {
        slug
        ... on Nhtbl_project {
          title(format: RENDERED)
          excerpt(format: RENDERED)
          projectData {
            startDate
            endDate
          }
          nhtblClients {
            nodes {
              name
              slug
            }
          }
          nhtblServices {
            nodes {
              name
              slug
            }
          }

          featuredImage {
            node {
              altText
              colorPalette
              dominantColor
              secondaryColor
              mediaDetails {
                ...MediaDetailsFragment
              }
            }
          }
        }
      }
    }
  }
}

fragment AcfLinkBlockFragment on AcfLinkBlock {
  innerBlocks {
    name
    parentClientId
    clientId
    ...CoreParagraphFragment
    ...CoreHeadingFragment
    ...AcfHomePageHeroFragment
    ...AcfServicePushFragment
    ...CoreColumnsFragment
    ...AcfGalerieFragment
    ...AcfPortfolioBlockFragment
    ...CoreGroupFragment
    ...CoreButtonFragment
    ...CoreButtonsFragment
    ...CoreSpacerFragment
    ...CoreListFragment
    ...CoreListItemFragment
    ...PortfolioBlockDetailsFragment
    ...CoreImageFragment
  }
  attributes {
    align
    backgroundColor
  }
  linkBlock {
    internalLink {
      nodes {
        slug
        uri
      }
    }
    externalLink {
      url
      title
      target
    }
  }
}


fragment AcfSlideshowFragment on AcfSlideshow {
  attributes {
    align
    backgroundColor
    style
    className
  }
  slideshow {
    autoplay
    intervalMs
    aspectRatio
    showNavigation
  }
}

fragment AcfSlideFragment on AcfSlide {
  slide {
    caption
    image {
      node {
        altText
        colorPalette
        dominantColor
        secondaryColor
        mediaType
        mimeType
        mediaDetails {
          ...MediaDetailsFragment
        }
      }
    }
  }
}

fragment AcfSubpageNavigationFragment on AcfSubpageNavigation {
  attributes {
    align
  }
  navItems {
    databaseId
    title
    uri
    isCurrent
  }
}

fragment CoreListFragment on CoreList {
  attributes {
    ordered
    reversed
    start
    type
    textColor
    className
  }
}

fragment CoreListItemFragment on CoreListItem {
  attributes {
    content
    fontSize
    fontFamily
    textColor
  }
}
